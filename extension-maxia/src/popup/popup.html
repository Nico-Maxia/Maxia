<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxia V-Mobility Assistant</title>
  <link rel="stylesheet" href="../assets/css/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Maxia Assistant</h1>
    </header>
    
    <div class="auth-section" id="authSection">
      <!-- Section de connexion -->
      <div class="login-form" id="loginForm">
        <h2>Connexion</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Se connecter</button>
          </div>
        </form>
        <div class="message" id="loginMessage"></div>
      </div>
    </div>
    
    <div class="main-section hidden" id="mainSection">
      <!-- Section principale après connexion -->
      <div class="user-info">
        <p>Connecté en tant que: <span id="userName"></span></p>
        <p>Licence: <span id="licenseInfo"></span></p>
      </div>
      
      <div class="workflows-section">
        <h2>Flux disponibles</h2>
        <ul id="workflowsList" class="workflows-list">
          <!-- Les flux seront injectés ici dynamiquement -->
        </ul>
      </div>
      
      <div class="actions">
        <button id="logoutBtn" class="btn btn-danger">Déconnexion</button>
      </div>
    </div>
  </div>
  
  <script src="../modules/authentication/auth.js"></script>
  <script src="../modules/workflows/workflows.js"></script>
  <script src="popup.js"></script>
</body>
</html>
